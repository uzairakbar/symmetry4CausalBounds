[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry4CausalBounds"
version = "0.1.0"
description = "Symmetry Constrained Causal Partial Identification"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.6",
    # cvxpy>=1.6 stops bundling ECOS; the CLARABEL->ECOS fallback in
    # sensitivity_models.py needs it explicitly
    "ecos>=2.0.14",
    "enlighten>=1.12.4",
    "fsspec>=2024.6.1",
    # analytic gradients for the SLSQP solves (jaxlib CPU is enough)
    "jax>=0.4.38",
    "joblib>=1.4",
    "loguru>=0.7",
    "matplotlib>=3.9",
    "munch>=4.0.0",
    "numpy>=2.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6",
    "scipy>=1.14.1",
    "seaborn>=0.13.2",
    # single-BLAS-thread pinning in the serial solve path (see sensitivity_models)
    "threadpoolctl>=3",
    "torch>=2.6",
    "torchvision>=0.21",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pre-commit",
    "mypy",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# PLAN.md excluded: historical doc, ruff would reformat its embedded code blocks
extend-exclude = ["build", ".venv", "PLAN.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S"]
# S311: random.* used for scientific RNG throughout, not crypto
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
# asserts are fine in gate scripts; select_domnist_budgets runs git for provenance
"scripts/*" = ["S101", "S603", "S607"]
# deliberate star re-export hub, __all__ is the curated surface
"src/experiments/utils/__init__.py" = ["F403", "F405"]

[tool.mypy]
ignore_missing_imports = true
