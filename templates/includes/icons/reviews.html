<svg xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512">
    <!-- The Stem: A jaunty curve pointing left -->
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" 
          d="M256 128c-16-32-48-64-80-64"/>

    <!-- The Leafy Cap: A zig-zag path to create that "splat" look on top -->
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" 
          d="M272 112 l-48 64 
             l-64-16 48 48 
             l-48 48 80-32 
             l32 48 32-64 
             l64 16-48-48 
             l48-48-96 48z"/>

    <!-- The Body: Asymmetric and lopsided -->
    <!-- Starts under the right leaf, curves big around the bottom, ends under left leaf -->
    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" 
          d="M368 192 c 64 32 80 96 80 160 
             c 0 96 -96 144 -192 144 
             c -96 0 -176 -64 -176 -160 
             c 0 -48 32 -96 100 -128"/>
</svg>
