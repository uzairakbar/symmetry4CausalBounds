defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    normalize: true
    n_jobs: -1
simulation:
    seed: 42
    n_samples: 2_048
    n_experiments: 8
    sweep_samples: 64
    kernel_dim: 0
    treatment_dim: 32
    iv: 2
    methods:
        - ATE
        - ERM
        - DA+ERM
        - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
    augmentation: translate
    experiment:
        query: true
