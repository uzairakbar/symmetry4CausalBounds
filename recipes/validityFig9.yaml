defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    normalize: true
    gamma_n: 95
    n_jobs: -1
simulation:
    seed: 42
    n_samples: 2_048
    n_experiments: 10
    sweep_samples: 16
    kernel_dim: 0
    treatment_dim: 32
    iv: 1
    methods:
        - PI+INV+IV
        - PI+IV
        - DA+PI+IV(Z)
        - DA+PI+IV(T,Z)
        - PI&DA+PI+IV(Z)
        - PI&DA+PI+IV(T,Z)
    augmentation: translate
    experiment:
        sweep:
            param:  [gamma]
            metric: [coverage, approx_error, worst_error, width]
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 10
    sweep_samples: 16
    methods:
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
        - PI&DA+PI
        - PI&DA+PI+IV(T)
    # translate (sum-zero pixel translation, x -> x + B t) linearises the pixel-permutation
    # symmetry it replaces; T is informative because E[GX | t] = B t
    augmentation: rotation > hflip > vflip > translate
    augmentation_p: 0.25  # rotation / flip probability (default 0.5, the query panel's)
    experiment:
        sweep:
            param:  [gamma]
            metric: [coverage, approx_error, worst_error, width]
cigarettes:
    seed: 42
    target: plasmode
    spec: t3
    anchor: own-tax
    iv: [tax_s, y, cpi]
    gamma_z: 0.01
    n_samples: 2_450
    n_experiments: 10
    sweep_samples: 16
    da_amplitude: 2.0
    sliver: false
    methods:
        - PI+INV+IV
        - PI+IV
        - DA+PI+IV(Z)
        - DA+PI+IV(T,Z)
        - PI&DA+PI+IV(Z)
        - PI&DA+PI+IV(T,Z)
    augmentation: translate
    experiment:
        sweep:
            param:  [gamma]
            metric: [coverage, approx_error, worst_error, width]
