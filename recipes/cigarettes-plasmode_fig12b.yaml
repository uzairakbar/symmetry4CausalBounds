defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    n_jobs: -1
    normalize: true     # width and worst-error sweep figures as fractions of the baseline (PI)

cigarettes:
    seed: 42
    # every cigarette SWEEP runs here: the real FWL'd design with a synthetic
    # exactly homogeneous h_* and confounding of known strength, so gamma* IS the
    # true gamma and coverage means something. The restricted-2sls target lives in
    # neighbour-price_fig12.yaml and reports the query figures alone.
    target: plasmode
    spec: t3
    anchor: own-tax
    # the same instrument set the query recipe declares. The plasmode confounder is
    # projected off it before it is injected, so the set is valid by construction
    # here (83% of the confounder survives, and it then touches own price and
    # neighbour price alone, which are the two endogenous coefficients).
    iv: [tax_s, y, cpi]
    # Conley's direct-effect scale at delta = 0.05: r_Z = s sqrt(gamma_z) = 0.133,
    # above the bootstrap noise floor 0.104 of the moment it bounds
    gamma_z: 0.0177
    n_samples: 2_450
    n_experiments: 8
    sweep_samples: 128
    da_amplitude: 1.0
    sliver: false
    # DA+PI+IV(T) and DA+PI+IV(Z) carry one constraint each; the bare DA+PI+IV
    # carries both, at its own radius each
    methods: [PI+INV, PI, PI+IV, DA+PI, DA+PI+IV, DA+PI+IV(T), DA+PI+IV(Z), PI&DA+PI, PI&DA+PI+IV]
    augmentation: translate
    experiment:
        sweep:
            param:  [epsilon, gamma, trS, n, m, recalibrate]
            metric: [coverage, approx_error, worst_error, width]
        perf:
            metric: [wall_clock, seed_var]
            repeats: 3
