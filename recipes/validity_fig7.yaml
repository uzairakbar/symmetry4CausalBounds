defaults:
    calibrate: false
    pad: true
    clipy: false
    mean_match: true
    n_jobs: -1

simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: 0                   # bases of null(f) to construct DA. Set to 0 or -1 for random or full respectively.
    n_experiments: 8
    sweep_samples: 32
    methods:
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: translate
    experiment:
        sweep:
            param:  [gamma]
            metric: [coverage]

optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 8
    sweep_samples: 32
    methods:
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        sweep:
            param:  [gamma]
            metric: [coverage]
