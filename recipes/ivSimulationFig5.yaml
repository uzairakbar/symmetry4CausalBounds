defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    normalize: true
    gamma_n: 95
    n_jobs: -1
simulation:
    seed: 42
    n_samples: 2_048
    n_experiments: 10
    sweep_samples: 64
    kernel_dim: 0
    treatment_dim: 32
    iv: 1
    methods:
        - ATE
        - ERM+IV
        - DA+ERM+IV(Z)
        - DA+ERM+IV(T,Z)
        - PI+INV+IV
        - PI+IV
        - DA+PI+IV(Z)
        - DA+PI+IV(T,Z)
    augmentation: translate
    experiment:
        query: true
