defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    n_jobs: -1
    normalize: true     # width and worst-error sweep figures as fractions of the baseline (PI)

simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: 0
    treatment_dim: 32
    # a 4-dim standard-Gaussian instrument reaching X through a rank-4 map: an
    # INCOMPLETE IV that identifies 4 of the 32 directions and nothing else
    iv: 4
    n_experiments: 8
    sweep_samples: 128
    # a DA+ IV method takes an instrument mode: bare (or `"DA+PI+IV(T,Z)"`, quoted
    # in a flow list, or the comma splits it) constrains BOTH instruments, each at
    # its own radius; `DA+PI+IV(Z)` the configured instrument alone, no T term
    methods: [PI+INV, PI, PI+IV, PI+INV+IV, DA+PI, DA+PI+IV, DA+PI+IV(Z), PI&DA+PI, PI&DA+PI+IV]
    augmentation: translate
    experiment:
        query: true
        sweep:
            param:  [epsilon, gamma, trS, n, m]
            metric: [coverage, approx_error, worst_error, width]
