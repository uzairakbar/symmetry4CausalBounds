defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    n_jobs: -1

cigarettes:
    seed: 42
    target: iv              # iv = restricted-2sls target, z discarded; plasmode = synthetic h* and confounding
    spec: t3
    anchor: own-tax
    n_samples: 2_450
    n_experiments: 8
    sweep_samples: 128
    da_amplitude: 1.0
    sliver: false
    methods:
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: translate
    experiment:
        query: true
        sweep:
            param:  [epsilon, gamma, trS, n, m, recalibrate]
            metric: [coverage, approx_error, worst_error, width]
