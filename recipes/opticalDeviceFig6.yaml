defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: false
    normalize: true
    # a population-level illustration, like do-MNIST unpadded: the raw program and the
    # DA T row at its oracle leak + 2^-8. The T row's bite on optical is a large-sample
    # effect; at n = 1000 the padded T row is slack
    gamma_n: 0
    oracle_t_leak: true
    n_jobs: -1
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 10   # the query runs `dataset_index` (8) alone
    sweep_samples: 64
    methods:
        - ATE
        - ERM
        - DA+ERM
        - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        query: true
