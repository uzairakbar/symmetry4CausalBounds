# global toggles, overridable per experiment
defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: false
    n_jobs: -1
    normalize: true
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 8
    sweep_samples: 32
    methods:
        - ATE
        - ERM
        - DA+ERM
        - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        query: true