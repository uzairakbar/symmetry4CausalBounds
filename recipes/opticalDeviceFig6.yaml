defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: false
    normalize: true
    gamma_n: 95
    n_jobs: -1
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 10   # the query runs `dataset_index` (8) alone
    sweep_samples: 64
    methods:
        - ATE
        - ERM
        - DA+ERM
        - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        query: true
