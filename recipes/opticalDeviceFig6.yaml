defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: false
    normalize: true
    n_jobs: -1
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 10   # the query runs `dataset_index` (8) alone
    sweep_samples: 64
    methods:
        - ATE
        - ERM
        - DA+ERM
        - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
    # translate (sum-zero pixel translation, x -> x + B t) linearises the pixel-permutation
    # symmetry it replaces; T is informative because E[GX | t] = B t
    augmentation: rotation > hflip > vflip > translate
    experiment:
        query: true
