defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    normalize: true
    n_jobs: -1
simulation:
    seed: 42
    n_samples: 2_048
    n_experiments: 8
    sweep_samples: 16
    kernel_dim: 0
    treatment_dim: 32
    iv: 2
    methods:
        - PI+INV+IV
        - PI+IV
        - DA+PI+IV(Z)
        - DA+PI+IV(T,Z)
        - PI&DA+PI+IV(Z)
        - PI&DA+PI+IV(T,Z)
    augmentation: translate
    experiment:
        perf:
            metric: [wall_clock]
            repeats: 3
optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 8
    sweep_samples: 16
    methods:
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV(T)
        - PI&DA+PI
        - PI&DA+PI+IV(T)
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        perf:
            metric: [wall_clock]
            repeats: 3
cigarettes:
    seed: 42
    target: plasmode
    spec: t3
    anchor: own-tax
    iv: [tax_s, y, cpi]
    gamma_z: 0.0177
    n_samples: 2_450
    n_experiments: 8
    sweep_samples: 16
    da_amplitude: 2.0
    sliver: false
    methods:
        - PI+INV+IV
        - PI+IV
        - DA+PI+IV(Z)
        - DA+PI+IV(T,Z)
        - PI&DA+PI+IV(Z)
        - PI&DA+PI+IV(T,Z)
    augmentation: translate
    experiment:
        perf:
            metric: [wall_clock]
            repeats: 3
