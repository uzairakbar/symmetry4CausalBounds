defaults:
    recalibrate: true
    pad: true
    clipy: false
    mean_match: true
    n_jobs: -1

cigarettes:
    seed: 42
    target: iv              # the restricted-2sls target against the CONFIGURED instrument set below
    spec: t3
    anchor: own-tax
    # the instrument set: the own excise, with income and the CPI instrumenting
    # themselves (included exogenous). Decides the target and reaches every solver.
    iv: [tax_s, y, cpi]
    # the declared IV leakiness budget, the default written out: radius
    # s sqrt(gamma_z) = 6.25% of the residual sd
    gamma_z: 0.00390625
    n_samples: 2_450
    n_experiments: 8
    sweep_samples: 128
    da_amplitude: 1.0
    sliver: false
    methods: [PI+INV, PI, PI+IV, PI+INV+IV, DA+PI, DA+PI+IV, PI&DA+PI, PI&DA+PI+IV]
    augmentation: translate
    experiment:
        query: true
        sweep:
            param:  [epsilon, gamma, trS, n, m, recalibrate]
            metric: [coverage, approx_error, worst_error, width]
