# net training; reaches GradientDescentERM._fit via fit_model. The linear
# experiments have no nets and ignore every key here.
hyperparameters:
    lr: 0.01            # learning rate
    batch: 256          # batch size
    epochs: 1           # NOT 3: measured on floor95 = 2*p95(|mu_erm - h^|), the
                        # quantity that sets PI width, 1 epoch beats 3 by 3.6% and
                        # is 2x faster. More epochs => each net fits its OWN label
                        # realisation => the two nets share less error, so d's TAIL
                        # grows even as its median improves.
    optimizer: adam
    betas: [0.7, 0.9]
    onecycle: true      # OneCycleLR
    loss: mse           # Brier: proper for the MEAN, which is what CopSens consumes
