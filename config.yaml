---
linear_simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: -1          # bases of null(f) to construct DA. Set to 0 or -1 for random or full respectively.
    n_experiments: 5 #32
    sweep_samples: 32
    methods:
        - ERM
        - DA+ERM
        - ATE
        - PI
        - DA+PI
    augmentation: translate
    plot_panel: true

optical_device:
    seed: 42
    n_samples: 1_000
    sweep_samples: 32
    methods:
        - ERM
        - DA+ERM
        - ATE
        - PI
        - DA+PI
    augmentation: all
    plot_panel: true

