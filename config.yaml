#                                     # head (SLSQP); 2 adds the ~74k-param fc1 (slow
#                                     # augmented-Lagrangian path, correctness runs only)
#     gamma: 0.067                    # = oracle gamma* = bias_sq/sigma_sq (calibrated):
#                                     # the partial_r2_net ball is the Lemma-2 ball in
#                                     # function space, so gamma* is PRINCIPLED here.
#     epsilon: 0.1                    # T-invariance defect of h*: a MODELLING ASSUMPTION,
#                                     # not estimable. The true value is 0 for this
#                                     # augmentation (+-10 deg cannot turn a 2 into a 5,
#                                     # and colour never causes Y); this is finite-sample
#                                     # slack. eps=0 makes the IV budget exactly 0.
#                                     # PI+INV: measured floor at l=1, gamma*, n_pi=6k is
#                                     # 0.004 < eps^2 0.01, so PI+INV is feasible there.
#                                     # Re-read the floor/budget pair logged per
#                                     # experiment at the real n_pi before deciding --
#                                     # do NOT add tolerance to hide an INFEASIBLE.
#     augmentation: translate > rotation > contrast > saturation > hue
#     methods:                        # REQUIRED: the partial_r2_net backend defines only
#         # - ATE                       # these 9; the fallback is all 11 of ALL_METHODS
#         # - ERM
#         # - DA+ERM
#         - PI
#         - DA+PI
#         - PI+INV
#         - DA+PI+IV
#         - PI&DA+PI
#         - PI&DA+PI+IV
#     calibrate: true                 # budgets scaled by sigma-hat^2 = the ERM net's MSE
#     n_jobs: -1                      # per-query SLSQP workers. EXACT: bounds come out
#                                     # bit-identical to n_jobs=1.
#     experiment:
#         # query: true                 # digit-exemplar sweep; the PC panel is off here
#         perf:
#             metric: [wall_clock, seed_var]    # seed_var needs n_experiments >= 2

optical_device:
    seed: 42
    n_samples: 1_000
    n_experiments: 8
    sweep_samples: 32
    methods:
        # - ATE
        # - ERM
        # - DA+ERM
        # - DA+IV
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    # augmentation: all
    augmentation: rotation > gaussian-noise # rotation > gaussian
    # augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        query: true                 # query sweep; panel ALWAYS generated
        sweep:
            # validity = (gamma, approx_error), robustness = (epsilon, approx_error),
            # informativeness = (trS, worst_error)
            param:  [epsilon, gamma, trS, n, m]
            metric: [coverage, approx_error, worst_error, width]
        scatter:
            param:  [n, m]
            metric: [[width, coverage], [approx_error, width]]
        perf:
            metric: [wall_clock, seed_var]

# net training; reaches GradientDescentERM._fit via fit_model. The linear
# experiments have no nets and ignore every key here.
hyperparameters:
    lr: 0.01            # learning rate
    batch: 256          # batch size
    epochs: 1           # NOT 3: measured on floor95 = 2*p95(|mu_erm - h^|), the
                        # quantity that sets PI width, 1 epoch beats 3 by 3.6% and
                        # is 2x faster. More epochs => each net fits its OWN label
                        # realisation => the two nets share less error, so d's TAIL
                        # grows even as its median improves.
    optimizer: adam
    betas: [0.7, 0.9]
    onecycle: true      # OneCycleLR
    loss: mse           # Brier: proper for the MEAN, which is what the PI backend wants
