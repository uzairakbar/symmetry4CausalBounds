---
linear_simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: -1          # bases of null(f) to construct DA. Set to 0 or -1 for random or full respectively.
    n_experiments: 32
    sweep_samples: 16
    methods:
        - MSM
        - DA+MSM
    augmentations:
        - translate

