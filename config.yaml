# global toggles, overridable per experiment
defaults:
    recalibrate: true   # scale the post-DA budget to gamma/rho (SS4.2); false keeps the inherited gamma
    pad: true #false #true #true #false #true          # eps-pad DA+ intervals (Thm. 3)
    clipy: false #false #true #false #true #false #true         # clip intervals to observed outcome range
    mean_match: true #false #true #false #true #false #true #false #true #true #true #false #true #false #true #true    # Lem. 2: solve on the mean-matched slice E[h(X)] = E[Y],
                        # i.e. the covariance ball around the WITH-INTERCEPT erm.
                        # Exact on the linear backend (the intercept is eliminated
                        # by centring); a 2-SE band on the do-MNIST nets, where the
                        # constraint is nonlinear (see MEAN_BAND_SE).
                        # false = the pre-2026-09 uncentred, intercept-free ball.
    n_jobs: -1          # query-solve workers. 1 = serial, -1 = all cores.
                        # Shared node: keep <= 16. Perf plot always runs serial.
# The IV budgets are not toggles: the T-as-IV radius is the oracle
# ||E[W#|T]|| (`eps_iv_star`), and an observed instrument gets its own
# constraint at its own radius. See oracle.eps_iv_star.

# `experiment:` selects what to run. Omitted n_samples/n_experiments/
# sweep_samples fall back to DatasetDefaults, omitted `methods` to the full
# registry (configs.py). sweep/perf are validated but not yet wired.

# # ---
simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: 0                   # bases of null(f) to construct DA. Set to 0 or -1 for random or full respectively.
    treatment_dim: 32               # SEM treatment dimension; omitted = DatasetDefaults (32)
    # dimension of a standard-Gaussian instrument generated in the SEM. It reaches
    # X through a rank-m map into a 32-dim treatment: an INCOMPLETE IV that
    # identifies m of k directions and nothing else. 0 or omitted = no instrument
    # and every number is the one shipped today. The IV run is recipes/iv_fig13.yaml.
    # iv: 4
    n_experiments: 8
    sweep_samples: 16
    methods:
        # - ATE
        # - ERM
        # - DA+ERM
        # - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: translate
    experiment:
        query: true                 # query sweep; panel ALWAYS generated
        sweep:
        #     # validity = (gamma, approx_error), robustness = (epsilon, approx_error),
        #     # informativeness = (omega, worst_error),
        #     # recalibration = (recalibrate, width): gamma~/gamma from 1/rho to 1 (SS4.2)
            # param:  [n, m]
            # metric: [coverage, approx_error, worst_error, width]
            param:  [epsilon, gamma, omega, n, m]
            metric: [coverage, approx_error, worst_error, width]
        # perf:
        #     metric: [wall_clock, seed_var, feasibility]

