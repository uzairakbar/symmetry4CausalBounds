# global toggles, overridable per experiment
defaults:
    recalibrate: true   # scale the post-DA budget to gamma/rho (SS4.2); false keeps the inherited gamma
    pad: true #false #true #true #false #true          # eps-pad DA+ intervals (Thm. 3)
    clipy: false #false #true #false #true #false #true         # clip intervals to observed outcome range
    mean_match: true #false #true #false #true #false #true #false #true #true #true #false #true #false #true #true    # Lem. 2: solve on the mean-matched slice E[h(X)] = E[Y],
                        # i.e. the covariance ball around the WITH-INTERCEPT erm.
                        # Exact on the linear backend (the intercept is eliminated
                        # by centring); a 2-SE band on the do-MNIST nets, where the
                        # constraint is nonlinear (see MEAN_BAND_SE).
                        # false = the pre-2026-09 uncentred, intercept-free ball.
    im-ci: 95           # Imbens-Manski CI level (%) around every SWEEP bound (App. E's
                        # gamma_n, put back as sampling error): coverage, approx_error,
                        # worst_error and width read the CI. 0 or false = the raw bounds
                        # (today's numbers). perf, query and do-MNIST never read it.
    n_jobs: 16          # query-solve workers. 1 = serial, -1 = all cores.
                        # Shared node: keep <= 16. Perf plot always runs serial.
# The IV budgets are not toggles: the T-as-IV radius is the oracle
# ||E[W#|T]|| (`eps_iv_star`), and an observed instrument gets its own
# constraint at its own radius. See oracle.eps_iv_star.

# `experiment:` selects what to run. Omitted n_samples/n_experiments/
# sweep_samples fall back to DatasetDefaults, omitted `methods` to the full
# registry (configs.py). sweep/perf are validated but not yet wired.

# # ---
simulation:
    seed: 42
    n_samples: 2_048
    kernel_dim: 0                   # bases of null(f) to construct DA. Set to 0 or -1 for random or full respectively.
    treatment_dim: 32               # SEM treatment dimension; omitted = DatasetDefaults (32)
    # dimension of a standard-Gaussian instrument generated in the SEM. It reaches
    # X through a rank-m map into a 32-dim treatment: an INCOMPLETE IV that
    # identifies m of k directions and nothing else. 0 or omitted = no instrument
    # and every number is the one shipped today. The IV run is recipes/iv_fig13.yaml.
    # iv: 4
    n_experiments: 8
    sweep_samples: 16
    methods:
        # - ATE
        # - ERM
        # - DA+ERM
        # - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: translate
    experiment:
        query: true                 # query sweep; panel ALWAYS generated
        sweep:
        #     # validity = (gamma, approx_error), robustness = (epsilon, approx_error),
        #     # informativeness = (omega, worst_error),
        #     # recalibration = (recalibrate, width): gamma~/gamma from 1/rho to 1 (SS4.2)
            # param:  [n, m]
            # metric: [coverage, approx_error, worst_error, width]
            param:  [epsilon, gamma, omega, n, m]
            metric: [coverage, approx_error, worst_error, width]
        # perf:
        #     metric: [wall_clock, seed_var, feasibility]

do_mnist:
    seed: 42
    n_experiments: 1                # replicates: the query path runs one, the sweeps
                                    # run this many, two 1.2M-draw nets retrained per
                                    # replicate (~1 min each on a GPU plus the PI fits)
    n_samples: 1_200_000            # SEM draws from split A (40k images x 30 fresh
                                    # (U,C,t,S) draws); 60k draws memorise
    n_pi: 60_000                    # rows the PI machinery is fit on, drawn from split B
                                    # at seed + 1; never the nets' draw
    n_queries: 2_000                # the evaluation population: MNIST TEST draws at
                                    # pop_seed, never in A/B/C; coverage and width are
                                    # reported here, not on the 10 exemplars
    sweep_samples: 10               # digit exemplars on the query x-axis
    net: domnist-fast
    n_components: 32                # latent dimension of the CopSens factor model
    calibrate_sigma: true           # radius sigma-hat sqrt(gamma), sigma-hat^2 =
                                    # E[mu(1-mu)] on the fit rows (probit)
    gamma: 0.08505258154439962      # EXPLICIT: the smallest gamma whose coverage of
                                    # h* on split C reaches target_coverage, selected by
                                    #   uv run python scripts/select_domnist_gamma.py
                                    # (bisection on log gamma, max over PI 0.0362 and
                                    # DA+PI 0.0851 at mix_in 0.05). A LATENT budget: the
                                    # Lemma-2 oracle gamma* does not measure it, so the
                                    # sweeps take this value, not the oracle
    target_coverage: 0.99           # what the selection script targets; provenance only
    epsilon: 0.04                   # T-invariance defect of h*: a MODELLING ASSUMPTION.
                                    # The true value is 0 for this chain (+-10 deg cannot
                                    # turn a 2 into a 5, colour never causes Y); this is
                                    # finite-sample slack. INV budget eps^2, IV budget
                                    # (eps + s sqrt(gamma_z_star))^2 = eps^2 at 0. With
                                    # inv_recenter off the INV floor is 0.0198 > 0.0016,
                                    # so PI+INV reads INFEASIBLE at every query; post-DA
                                    # (on) it needs eps >= 0.055 to be well posed
    gamma_z_star: 0.0               # true baseline IV budget of Thm. 3.B; 0 = none
    inv_recenter: 'off'             # QUOTE it. off: PI+INV centred on the ERM, ball on
                                    # X, pairs (X, GX). on: centred on DA+ERM, ball on the
                                    # unmixed GX, pairs (GX, X)
    mix_in: 0.05                    # share of the DA measure's rows swapped back to
                                    # their observed row (Asm. 1b): DA+ERM's draw and the
                                    # DA+PI / DA+PI+IV fit rows (identity G there); never
                                    # PI or the PI+INV pairs. 0 = off
    split_seed: 420                 # ONE frozen image-level partition of the 60k
    split:                          # training images: A trains the nets, B is the only
        A: 40_000                   # thing the PI machinery sees, C is what the
        B: 10_000                   # selection script bisects on. Counts sum to 60k
        C: 10_000
    pop_seed: 44                    # must differ from seed + 1 (the C draw's seed)
    exemplar_seed: 420              # the 10 digits on the x-axis, alternating tints;
                                    # a VISUALISATION set, never scored
    augmentation: translate > rotation > contrast > saturation > hue
    augmentation_amounts: null      # per-op overrides, e.g. {hue: 0.4}; null = the
                                    # frozen defaults (contrast .15 saturation .10 hue
                                    # .025 brightness .15)
    methods:                        # REQUIRED: the copsens backend defines 9, the
        - ATE                       # fallback is all of ALL_METHODS. PI+INV last: it is
        - ERM                       # the slow one when eps sits on a sliver
        - DA+ERM
        - PI
        - DA+PI
        - DA+PI+IV
        - PI+INV
    recalibrate: false              # the latent ball has no rho; the reference ran gamma as is
    pad: false
    n_jobs: -1                      # per-query SLSQP workers. EXACT: bounds come out
                                    # bit-identical to n_jobs 1
    experiment:
        query: true                 # exemplar figure + population run.json
        # sweep:
        #     param:  [gamma]       # ratio grid around the declared gamma. PI+INV off
        #     metric: [coverage, approx_error, worst_error, width]

optical_device:
    seed: 42
    n_samples: 1_000    # the device recorded exactly this many rows; ask for more
                        # and the SEM resamples them WITH REPLACEMENT
    n_experiments: 8    # replicates of the SAME device (`dataset_index` is fixed),
                        # so the error bars are over the DRAW -- resampling and the
                        # DA realisation -- not over devices. The oracle itself is
                        # read off the whole pool and does not move between them.
    sweep_samples: 16
    methods:
        # - ATE
        # - ERM
        # - DA+ERM
        # - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    # augmentation: all
    # augmentation: rotation > gaussian-noise # rotation > gaussian
    augmentation: rotation > hflip > vflip > random-permutation
    experiment:
        # query: true                 # query sweep; panel ALWAYS generated
    #     sweep:
    #         # validity = (gamma, approx_error), robustness = (epsilon, approx_error),
    #         # informativeness = (omega, worst_error)
    #         # param:  [gamma]
    #         # metric: [coverage, approx_error, worst_error, width]
            param:  [epsilon, gamma, omega, n, m]
            metric: [coverage, approx_error, worst_error, width]
        # # perf:
        # #     metric: [wall_clock, seed_var, feasibility]

cigarettes:
    seed: 42
    # iv       = h* solves the tax-moment program SUBJECT TO v'beta = 0 (restricted
    #            2SLS), so it satisfies the instrument and homogeneity at once;
    #            Z is then discarded. eps* = 0 by construction, nothing is padded.
    #            A VALIDITY AND SHARPNESS experiment: the target was built to
    #            satisfy both assumptions, so coverage of it is measurable on
    #            real data (conditional on those assumptions). Every sweep runs.
    #            Only the value AT gamma* is a tautology, so the query panel uses
    #            the DECLARED per-spec configs.QUERY_GAMMA; the SWEEPS solve at
    #            gamma*(target).
    # plasmode = real design, synthetic exactly-homogeneous h* and synthetic
    #            confounding of known strength; gamma* == gamma_true. VALIDITY.
    target: plasmode #iv
    # state FE plus a trend of this order. t3 is chosen by the restriction's own
    # diagnostics: the OLS ladder converges there (rho_max 1.0020, unchanged at
    # t4), the restricted-GMM J does not reject under state or year clustering
    # (2.74 / 1.75; it DOES under iid, 6.62), and it is the only cell whose
    # leaky-IV sliver is non-empty at both guard levels. t1 and t2 are the
    # pre-registered falsification rows: reported, not run.
    spec: t3
    # own-tax = Z is the own state excise, only log p endogenous (F 68 state /
    #           324 year). own-and-neighbour adds the min-neighbour excise for
    #           log p_n: weak at t1 (F 10.0 / 4.8) and the sliver is empty.
    anchor: own-tax
    n_samples: 2_450        # the whole panel; more resamples WITH replacement
    n_experiments: 8        # iv: state-cluster bootstrap replicates of the fit
                            # sample with h* held fixed from the full pool, so
                            # the bars are a resampling RATE. plasmode: fresh
                            # (U, xi) per experiment on the fixed design.
    sweep_samples: 16      # also the per-dimension query grids, forced EVEN so
                            # the exact zero stays off them
    # DA amplitude along v = (1,1,1,1), in units of sd(X . v-hat) after FWL
    # (0.1055 at t3). The omega sweep multiplies this by its own `scale` knob.
    da_amplitude: 2.0
    # the leaky-IV misspecification guard. false = the target is the restricted
    # point alone. gamma_z is FIXED at CigaretteConfig.gamma_z, never swept; the
    # sliver is empty at every spec except t3 with the own-tax anchor.
    sliver: false
    # the instrument set, by panel column name. An excise column is an external
    # instrument; a TREATMENT name means that regressor instruments itself, i.e. it
    # is assumed exogenous and no confounding budget is spent on it. This is the
    # included-exogenous block of a 2SLS instrument matrix, which is what
    # `PanelDesign.instruments` already builds for the target. Legal: [], [tax_s],
    # [tax_sn], [tax_s, tax_sn], [tax_s, y, cpi]. Omitted or [] = the anchor set
    # decides the target (b_r) and every solver sees an empty instrument, which is
    # exactly today's run. The neighbour-price run is recipes/neighbour-price_fig12.yaml.
    # iv: [tax_s, y, cpi]
    # the IV leakiness budget for the instruments listed in `iv:`, DECLARED on every
    # path (SS2.6). The radius is s*sqrt(gamma_z), a fraction of the residual sd;
    # 2^-8 gives 6.25%. Omit the key and that default is used. It is the radius of
    # the observed instrument's own constraint; the T-as-IV budget is separate.
    # gamma_z: 0.00390625     # 2^-8, the default; present here only to be explicit
    methods:
        # - ATE
        # - ERM
        # - DA+ERM
        # - DA+ERM+IV(T)
        - PI+INV
        - PI
        - DA+PI
        - DA+PI+IV
        - PI&DA+PI
        - PI&DA+PI+IV
    augmentation: translate
    experiment:
        query: true
        sweep:
            param:  [epsilon, gamma, omega, n, m, recalibrate]
            metric: [coverage, approx_error, worst_error, width]

# net training; reaches GradientDescentERM._fit via fit_model. The linear
# experiments have no nets and ignore every key here.
hyperparameters:
    lr: 0.01            # learning rate
    batch: 256          # batch size
    epochs: 1           # NOT 3: measured on floor95 = 2*p95(|mu_erm - h^|), the
                        # quantity that sets PI width, 1 epoch beats 3 by 3.6% and
                        # is 2x faster. More epochs => each net fits its OWN label
                        # realisation => the two nets share less error, so d's TAIL
                        # grows even as its median improves.
    optimizer: adam
    betas: [0.7, 0.9]
    onecycle: true      # OneCycleLR
    loss: mse           # Brier: proper for the MEAN, which is what the PI backend wants
