name: Build and Deploy Presentation

# The deck is rendered by the website deploy on gh-pages, against the figures in
# gh-pages:static/; this only asks it to redeploy when the slides change.
on:
  push:
    branches:
      - presentation
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'gh-pages'
            })
